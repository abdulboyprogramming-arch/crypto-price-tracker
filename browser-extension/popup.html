<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Tracker Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Error Message Container -->
  <div id="errorMessage" class="error-message" role="alert" aria-live="polite" style="display: none;"></div>

  <!-- Loading Spinner -->
  <div id="loading" class="loading-spinner" role="status" aria-live="polite" style="display: none;">
    <div class="spinner"></div>
    <p>Loading crypto data...</p>
  </div>

  <!-- Main Content -->
  <div id="mainContent" style="display: none;">
    <!-- Header -->
    <header class="header">
      <h1>💰 Crypto Tracker Pro</h1>
      <div class="header-controls">
        <button id="refreshBtn" class="refresh-btn" title="Refresh prices (Ctrl+Shift+R)" aria-label="Refresh cryptocurrency prices">
          <span class="icon">🔄</span>
        </button>
        <button id="settingsBtn" class="settings-btn" title="Settings (Ctrl+Shift+,)" aria-label="Open settings">
          <span class="icon">⚙️</span>
        </button>
      </div>
    </header>

    <!-- Last Updated -->
    <div class="last-updated" role="status" aria-live="polite">
      <small>Last updated: <time id="updateTime">--:--:--</time></small>
    </div>

    <!-- Market Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <div>Market Cap</div>
        <div class="stat-value" id="totalMarketCap">$--</div>
      </div>
      <div class="stat">
        <div>24h Volume</div>
        <div class="stat-value" id="totalVolume">$--</div>
      </div>
      <div class="stat">
        <div>BTC Dominance</div>
        <div class="stat-value" id="btcDominance">--%</div>
      </div>
    </div>

    <!-- Tabs -->
    <nav class="tabs" role="tablist">
      <button 
        class="tab active" 
        data-tab="prices" 
        role="tab" 
        aria-selected="true" 
        aria-controls="prices-content"
        id="tab-prices">
        📊 Prices
      </button>
      <button 
        class="tab" 
        data-tab="watchlist" 
        role="tab" 
        aria-selected="false" 
        aria-controls="watchlist-content"
        id="tab-watchlist">
        ⭐ Watchlist <span id="watchlistBadge" class="badge" aria-label="watchlist items"></span>
      </button>
      <button 
        class="tab" 
        data-tab="alerts" 
        role="tab" 
        aria-selected="false" 
        aria-controls="alerts-content"
        id="tab-alerts">
        🔔 Alerts
      </button>
    </nav>

    <!-- Tab Contents -->
    <div class="tab-contents">
      <!-- Prices Tab -->
      <div class="tab-content active" id="prices-content" role="tabpanel" aria-labelledby="tab-prices">
        <div id="pricesList" class="prices-list">
          <div class="empty-state">
            <p>Loading cryptocurrency data...</p>
          </div>
        </div>
      </div>

      <!-- Watchlist Tab -->
      <div class="tab-content" id="watchlist-content" role="tabpanel" aria-labelledby="tab-watchlist">
        <div id="watchlistList" class="watchlist-list">
          <div class="empty-state">
            <p>No items in watchlist. Add cryptocurrencies from the prices tab!</p>
          </div>
        </div>
      </div>

      <!-- Alerts Tab -->
      <div class="tab-content" id="alerts-content" role="tabpanel" aria-labelledby="tab-alerts">
        <div id="alertsList" class="alerts-list" aria-label="Active price alerts">
          <div class="empty-state">
            <p>No price alerts set yet.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="popup.js" type="module"></script>
</body>
</html>
